<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 940 420" class="fig" role="img" aria-label="Gassveien gjennom motoren: friskluft gaar fra luftfilter via turbokompressor, ladeluftkjoler og strupespjeld til innsugsmanifolden, ned i sylindrene, ut i eksosmanifolden, gjennom turbinen og videre til DOC og DPF. EGR tappes fra eksosmanifolden foer turbinen, kjoles i EGR-kjoleren og gaar via EGR-ventilen inn i innsugsmanifolden etter strupespjeldet.">
<style>
  svg { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; --fig-bg:#FBFBF9; --surface:#FFFFFF; --surface-3:#EDEEEA; --ink:#191C1B; --ink-2:#5A6160; --ink-3:#98A09E; --line:#C9CDC7; --hot:#B8481B; --cool:#276F86; --egr:#9A6E12; }
  @media (prefers-color-scheme: dark) { svg { --fig-bg:#181B20; --surface:#20242A; --surface-3:#2A3038; --ink:#E9EAE6; --ink-2:#A6ADAC; --ink-3:#6E7883; --line:#3B434C; --hot:#FF8B54; --cool:#63C2DA; --egr:#DFB24E; } }

  .sheet { fill: var(--fig-bg); }
  .dg-box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
  .dg-box-strong { fill: var(--surface-3); stroke: var(--ink-3); stroke-width: 1.5; }
  .divider { stroke: var(--ink-3); stroke-width: 1.5; }
  .hatch { stroke: var(--ink-3); stroke-width: 1.5; opacity: .55; }
  .tap { fill: var(--ink-2); }
  .dg-t { fill: var(--ink); font-size: 12.5px; }
  .dg-title { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .dg-t-sm { fill: var(--ink-2); font-size: 11px; }
  .lbl-egr { fill: var(--egr); }
  .hot { stroke: var(--hot); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .cool { stroke: var(--cool); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .egr { stroke: var(--egr); stroke-width: 2.5; fill: none; stroke-dasharray: 9 5; stroke-linecap: butt; stroke-linejoin: round; }
  .sens { stroke: var(--ink-3); stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
  .rule-dash { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 6; }
  .fill-hot { fill: var(--hot); }
  .fill-egr { fill: var(--egr); }
  .fill-cool { fill: var(--cool); }
</style>
  <defs>
    <marker id="f2-ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" class="fill-hot"/></marker>
    <marker id="f2-ah-egr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" class="fill-egr"/></marker>
    <marker id="f2-ah-cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" class="fill-cool"/></marker>
  </defs>
  <rect class="sheet" x="0" y="0" width="940" height="420"/>

  <!-- legend -->
  <line class="hot" x1="20" y1="46" x2="50" y2="46"/>
  <text class="dg-t-sm" x="56" y="50">eksos</text>
  <line class="egr" x1="130" y1="46" x2="160" y2="46"/>
  <text class="dg-t-sm" x="166" y="50">EGR</text>
  <line class="cool" x1="230" y1="46" x2="260" y2="46"/>
  <text class="dg-t-sm" x="266" y="50">friskluft / ladeluft</text>

  <!-- intake row, right to left -->
  <rect class="dg-box" x="770" y="96" width="150" height="48" rx="6"/>
  <text class="dg-t" x="845" y="125" text-anchor="middle">Luftfilter</text>
  <rect class="dg-box" x="580" y="96" width="150" height="48" rx="6"/>
  <text class="dg-t" x="655" y="125" text-anchor="middle">Turbokompressor</text>
  <rect class="dg-box" x="390" y="96" width="150" height="48" rx="6"/>
  <text class="dg-t" x="465" y="125" text-anchor="middle">Ladeluftkj&#248;ler</text>
  <rect class="dg-box" x="225" y="96" width="140" height="48" rx="6"/>
  <text class="dg-t" x="295" y="125" text-anchor="middle">Strupespjeld</text>
  <rect class="dg-box" x="40" y="96" width="160" height="48" rx="6"/>
  <text class="dg-t" x="120" y="125" text-anchor="middle">Innsugsmanifold</text>
  <path class="cool" d="M845,64 L845,92" marker-end="url(#f2-ah-cool)"/>
  <text class="dg-t-sm" x="845" y="56" text-anchor="middle">friskluft</text>
  <path class="cool" d="M770,120 L734,120" marker-end="url(#f2-ah-cool)"/>
  <path class="cool" d="M580,120 L544,120" marker-end="url(#f2-ah-cool)"/>
  <path class="cool" d="M390,120 L369,120" marker-end="url(#f2-ah-cool)"/>
  <path class="cool" d="M225,120 L204,120" marker-end="url(#f2-ah-cool)"/>
  <path class="cool" d="M60,144 L60,296" marker-end="url(#f2-ah-cool)"/>

  <!-- EGR band -->
  <rect class="dg-box" x="110" y="200" width="150" height="48" rx="6"/>
  <text class="dg-t" x="185" y="229" text-anchor="middle">EGR-ventil</text>
  <rect class="dg-box" x="290" y="200" width="150" height="48" rx="6"/>
  <text class="dg-t" x="365" y="229" text-anchor="middle">EGR-kj&#248;ler</text>
  <path class="egr" d="M330,300 L330,252" marker-end="url(#f2-ah-egr)"/>
  <path class="egr" d="M290,224 L264,224" marker-end="url(#f2-ah-egr)"/>
  <path class="egr" d="M185,200 L185,148" marker-end="url(#f2-ah-egr)"/>
  <text class="dg-t-sm lbl-egr" x="470" y="228">h&#248;ytrykks-EGR, tappet f&#248;r turbinen</text>

  <!-- exhaust row, left to right -->
  <rect class="dg-box" x="40" y="300" width="150" height="50" rx="6"/>
  <text class="dg-t" x="115" y="330" text-anchor="middle">Sylinder 1&#8211;4</text>
  <rect class="dg-box" x="210" y="300" width="150" height="50" rx="6"/>
  <text class="dg-t" x="285" y="330" text-anchor="middle">Eksosmanifold</text>
  <rect class="dg-box" x="380" y="300" width="140" height="50" rx="6"/>
  <text class="dg-t" x="450" y="330" text-anchor="middle">Turbin (VGT)</text>
  <rect class="dg-box-strong" x="540" y="300" width="120" height="50" rx="6"/>
  <text class="dg-t" x="600" y="330" text-anchor="middle">DOC</text>
  <rect class="dg-box-strong" x="680" y="300" width="120" height="50" rx="6"/>
  <text class="dg-t" x="740" y="330" text-anchor="middle">DPF</text>
  <path class="hot" d="M190,325 L206,325" marker-end="url(#f2-ah-hot)"/>
  <path class="hot" d="M360,325 L376,325" marker-end="url(#f2-ah-hot)"/>
  <path class="hot" d="M520,325 L536,325" marker-end="url(#f2-ah-hot)"/>
  <path class="hot" d="M660,325 L676,325" marker-end="url(#f2-ah-hot)"/>
  <path class="hot" d="M800,325 L895,325" marker-end="url(#f2-ah-hot)"/>
  <text class="dg-t-sm" x="895" y="348" text-anchor="end">midt- og bakpotte</text>

  <!-- sensors -->
  <circle class="tap" cx="528" cy="325" r="4"/>
  <path class="sens" d="M528,300 L528,284"/>
  <text class="dg-t-sm" x="528" y="277" text-anchor="middle">eksostemp.-sensor</text>
  <path class="sens" d="M540,372 L540,384 L800,384 L800,372"/>
  <text class="dg-t-sm" x="670" y="404" text-anchor="middle">differansetrykksensor over DOC + DPF</text>
  <path class="sens" d="M115,282 L115,296"/>
  <text class="dg-t-sm" x="115" y="275" text-anchor="middle">etterinnspr&#248;ytning ved regen.</text>
</svg>
